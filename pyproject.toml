[project]
name = "kern-agent"
version = "0.5.0"
description = "Kern — an OS-kernel-style agentic harness for one user-chosen model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "agent", "harness", "agentic", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "textual>=8.2.8,<9",
    "websockets>=15,<18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]
gui = ["PySide6>=6.6", "qasync>=0.27", "mistune>=3", "pygments>=2"]

# TODO: set the canonical repository URL before publishing, e.g.
# [project.urls]
# Repository = "https://github.com/<you>/kern"
# Issues = "https://github.com/<you>/kern/issues"

[project.scripts]
kern = "kern.__main__:main"
kern-gui = "kern.gui:main"
kern-serve = "kern.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["kern"]

[tool.hatch.build.targets.sdist]
include = ["/kern", "/tests", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# WP8: keep pytest focused on the tests/ tree and adopt the asyncio mode
# we use throughout the suite (mode=auto → individual @pytest.mark.asyncio
# isn't needed, but tests still pass with it; we keep it explicit so new
# tests can't silently regress to the wrong mode).
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
