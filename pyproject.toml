[project]
name = "kern-agent"
version = "0.3.0"
description = "Kern — an OS-kernel-style agentic harness for one user-chosen model"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "textual>=8.2.8,<9",
    "websockets>=15,<18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]
gui = ["PySide6>=6.6", "qasync>=0.27", "mistune>=3", "pygments>=2"]

[project.scripts]
kern = "kern.__main__:main"
kern-gui = "kern.gui:main"
kern-serve = "kern.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["kern"]

[tool.hatch.build.targets.sdist]
include = ["/kern", "/tests", "/README.md", "/pyproject.toml", "/uv.lock", "/AUDIT.md", "/DESIGN.md", "/RECHERCHE.md", "/RAPPORT_FINAL.md", "/TESTING.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
